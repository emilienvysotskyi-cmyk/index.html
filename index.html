<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #17212b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .user {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #5eb5f7;
    }
    .btn {
      padding: 16px 32px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: #2b5278;
      border: 1px solid #5eb5f7;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="user" id="label">Загрузка...</div>
  <button class="btn" id="go">Открыть профиль для передачи</button>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const raw = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get('startapp') || params.get('u') || '';
    const user = raw.replace(/^@/, '').trim();

    const label = document.getElementById('label');
    if (user) {
      label.textContent = '@' + user;
    } else {
      label.textContent = 'Получатель не указан';
    }

    function openTarget() {
      if (!user) return;
      const url = 'https://t.me/' + user;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.location.href = url;
      }
    }

    document.getElementById('go').onclick = openTarget;
    if (user) {
      setTimeout(openTarget, 400);
    }
  </script>
</body>
</html>
